<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; padding: 16px;
      background: #f5f5f5; color: #222;
      font-size: 16px; line-height: 1.5;
    }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    .card {
      background: #fff; border-radius: 12px;
      padding: 16px; margin-bottom: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .ok { color: #0a7; font-weight: 600; }
    .ng { color: #c33; font-weight: 600; }
    .btn {
      display: block; width: 100%;
      padding: 14px; margin-top: 8px;
      font-size: 1rem; border: none; border-radius: 10px;
      background: #1a73e8; color: #fff;
      text-align: center; text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Tips AI 販売 管理</h1>
  <div class="card">
    <p>セットアップ:
      <? if (status.setupComplete) { ?>
        <span class="ok">完了</span>
      <? } else { ?>
        <span class="ng">未完了</span>
      <? } ?>
    </p>
    <p>Gemini キー:
      <? if (status.hasGeminiKey) { ?>
        <span class="ok">設定済み</span>
      <? } else { ?>
        <span class="ng">未設定</span>
      <? } ?>
    </p>
    <? if (status.reviewWaitingCount > 0) { ?>
      <p>レビュー待ち: <strong><?= status.reviewWaitingCount ?></strong> 件</p>
    <? } else { ?>
      <p>レビュー待ち: 0 件</p>
    <? } ?>
  </div>
  <div class="card">
    <p>日常運用はこの画面から行います。</p>
    <p>レビュー一覧・承認ボタンは次の更新で追加予定です。</p>
    <? if (!status.setupComplete) { ?>
      <a class="btn" href="?page=setup">初回セットアップへ</a>
    <? } ?>
  </div>
</body>
</html>
