<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #f5f5f5; font-size: 16px; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .actions { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .btn { display: block; width: 100%; padding: 14px; margin: 0; font-size: 1rem; border: none; border-radius: 10px; background: #1a73e8; color: #fff; text-align: center; text-decoration: none; box-sizing: border-box; -webkit-appearance: none; appearance: none; }
    .btn.secondary { background: #5f6368; }
    .num { font-size: 1.5rem; font-weight: 700; color: #1a73e8; }
  </style>
</head>
<body>
  <h1>Tips AI 販売 管理</h1>
  <? if (authStatus.needsAuth) { ?>
  <div class="card" style="background:#fff8e1;border:1px solid #f9a825;">
    <p><strong>追加の許可が必要です</strong></p>
    <p style="font-size:14px;margin:8px 0;">Gemini で下書きを作るには、Google の権限画面を1回だけ開いて「許可」してください。</p>
    <a class="btn" href="<?= authStatus.url ?>" target="_blank" rel="noopener">許可画面を開く</a>
  </div>
  <? } ?>
  <div class="card">
    <p>レビュー待ち</p>
    <p class="num"><?= status.reviewWaitingCount ?></p> 件
    <p>修正待ち: <?= status.revisionWaitingCount ?> 件</p>
    <p>Tips連携待ち: <?= status.tipsPendingCount ?> 件</p>
    <p>未着手: <?= status.pendingCount ?> 件</p>
    <p>生成可能（失敗含む）: <?= status.generatableCount ?> 件</p>
    <? if (status.failedCount > 0) { ?>
    <p style="font-size:14px;color:#c33;">生成失敗: <?= status.failedCount ?> 件（生成ボタンで再試行できます）</p>
    <? } ?>
    <? if (status.spreadsheetUrl) { ?>
    <p style="font-size:14px;margin-top:8px;"><a href="<?= status.spreadsheetUrl ?>" target="_blank" rel="noopener">スプレッドシートを開く</a></p>
    <? } ?>
  </div>
  <div class="actions">
    <a class="btn" href="<?= webAppUrl ?>?page=review" target="_top">レビュー待ち一覧</a>
    <a class="btn secondary" href="<?= webAppUrl ?>?page=revision" target="_top">修正待ち一覧</a>
    <a class="btn secondary" href="<?= webAppUrl ?>?page=tips" target="_top">Tips連携</a>
    <button type="button" class="btn secondary" onclick="runGeminiTest()">Gemini 接続テスト（権限の再許可）</button>
    <button type="button" class="btn secondary" onclick="runGenerate()">下書きを1件生成</button>
  </div>
  <p id="msg" style="margin-top:12px;font-size:14px;color:#333;"></p>
  <script>
    function runGeminiTest() {
      var msg = document.getElementById('msg');
      msg.textContent = 'テスト中…';
      google.script.run
        .withSuccessHandler(function (r) {
          if (r.needsAuth && r.authUrl) {
            msg.innerHTML =
              escHtml(r.message) +
              '<br><br><a href="' +
              escHtml(r.authUrl) +
              '" target="_blank" rel="noopener" style="color:#1a73e8;font-weight:bold;">→ 許可画面を開く</a>';
            return;
          }
          msg.textContent = r.ok ? 'OK: ' + r.message : '結果: ' + (r.message || JSON.stringify(r));
        })
        .withFailureHandler(function (e) {
          msg.textContent = 'エラー: ' + e.message;
        })
        .runGeminiTestFromWeb();
    }

    function escHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(new RegExp('<', 'g'), '&lt;')
        .replace(new RegExp('>', 'g'), '&gt;');
    }

    function runGenerate() {
      document.getElementById('msg').textContent = '生成中…（1〜2分かかることがあります）';
      google.script.run
        .withSuccessHandler(function (r) {
          var text = r.message || JSON.stringify(r);
          if (!r.ok && !r.generated) {
            text += '\n（生成可能が0のときは、下のリンクからスプレッドシートを確認）';
          }
          document.getElementById('msg').textContent = text;
          if (r.ok && r.generated) location.reload();
        })
        .withFailureHandler(function (e) {
          document.getElementById('msg').textContent = 'エラー: ' + e.message;
        })
        .generateDrafts();
    }
  </script>
</body>
</html>
